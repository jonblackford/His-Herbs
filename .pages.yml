media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: site
    label: Website Content
    type: file
    path: content/site.json
    fields:
      - name: business
        label: Business Info
        type: object
        fields:
          - { name: name, label: Business Name, type: string }
          - { name: shortName, label: Short Name, type: string }
          - { name: tagline, label: Tagline, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: phoneHref, label: Phone Link, type: string }
          - { name: address, label: Full Address, type: string }
          - { name: addressLine1, label: Address Line 1, type: string }
          - { name: addressLine2, label: Address Line 2, type: string }
          - { name: mapsUrl, label: Google Maps Link, type: string }
          - { name: facebookUrl, label: Facebook Link, type: string }
          - { name: hoursNote, label: Hours Note, type: text }
      - name: home
        label: Homepage
        type: object
        fields:
          - { name: eyebrow, label: Small Intro Line, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro Paragraph, type: text }
          - { name: seasonNoteTitle, label: Season Note Title, type: string }
          - { name: seasonNoteText, label: Season Note Text, type: text }
      - name: introCards
        label: Homepage Intro Cards
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: services
        label: Main Services
        type: object
        list: true
        fields:
          - { name: icon, label: Icon, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: link, label: Link, type: string }
          - { name: linkText, label: Link Text, type: string }
      - name: floristServices
        label: Florist Services
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: greenhouseItems
        label: Greenhouse Items
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: seasonCards
        label: Seasonal Cards
        type: object
        list: true
        fields:
          - { name: season, label: Season Label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - name: items
            label: Bullet Items
            type: string
            list: true
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - { name: src, label: Image Path, type: image }
          - { name: alt, label: Alt Text, type: string }
          - { name: caption, label: Caption, type: text }
      - name: about
        label: About Page
        type: object
        fields:
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro, type: text }
          - name: body
            label: Body Paragraphs
            type: text
            list: true
          - name: values
            label: Value Pills
            type: string
            list: true
      - { name: contactIntro, label: Contact Page Intro, type: text }
      - name: formOptions
        label: Contact Form Dropdown Options
        type: object
        fields:
          - name: requestTypes
            label: Request Types
            type: string
            list: true
          - name: budgetRanges
            label: Budget Ranges
            type: string
            list: true
          - name: preferredContact
            label: Preferred Contact Options
            type: string
            list: true
