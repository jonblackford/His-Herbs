<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | Montrose Greenhouse — His & Herbs</title>
  <meta name="theme-color" content="#49623b" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    :root { --pine:#243b25; --moss:#49623b; --sage:#e4edda; --cream:#fffaf0; --muted:#66715f; --line:rgba(73,98,59,.16); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--pine); background: radial-gradient(circle at top left, rgba(227,170,79,.18), transparent 28rem), linear-gradient(135deg, var(--cream), #f1f6ed); }
    main { max-width: 760px; padding: clamp(1.5rem, 5vw, 3rem); background: rgba(255,253,248,.9); border:1px solid var(--line); border-radius: 32px; box-shadow:0 20px 60px rgba(36,59,37,.14); text-align:center; }
    .mark { width: 62px; height: 62px; display:grid; place-items:center; margin: 0 auto 1rem; border-radius: 22px; background: linear-gradient(145deg, var(--moss), #7f9b5f); color: var(--cream); font-size: 2rem; }
    h1 { margin:0; font-size: clamp(2.2rem, 7vw, 4rem); line-height:1.05; letter-spacing:-.05em; }
    p { color: var(--muted); font-size:1.08rem; }
    a { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:.9rem 1.15rem; background:var(--moss); color:var(--cream); text-decoration:none; font-weight:900; margin-top:.5rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✿</div>
    <h1>Thank you for reaching out.</h1>
    <p>Your message has been sent to Montrose Greenhouse — His & Herbs. Someone can follow up about availability, pricing, pickup, delivery, or next steps.</p>
    <a href="../">Back to the website</a>
  </main>
</body>
</html>
